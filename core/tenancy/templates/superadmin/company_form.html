{% extends 'superadmin/base.html' %}

{% block content %}
<div class="card">
    <div class="card-header"><h3 class="card-title">{{ title }}</h3></div>
    <form method="post" autocomplete="off">
        {% csrf_token %}
        <div class="card-body">
            {% if form.non_field_errors %}<div class="alert alert-danger">{{ form.non_field_errors }}</div>{% endif %}
            <div class="row">
                {% for field in form %}
                    <div class="col-md-6">
                        <div class="form-group">
                            <label>{{ field.label }}</label>
                            {{ field }}
                            {% if field.errors %}<small class="text-danger">{{ field.errors|striptags }}</small>{% endif %}
                        </div>
                    </div>
                {% endfor %}
            </div>
        </div>
        <div class="card-footer">
            <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Crear empresa</button>
            <a href="{{ list_url }}" class="btn btn-default">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
