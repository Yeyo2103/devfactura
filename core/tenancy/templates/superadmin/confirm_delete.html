{% extends 'superadmin/base.html' %}

{% block content %}
<div class="card">
    <div class="card-header"><h3 class="card-title">{{ title }}</h3></div>
    <form method="post">
        {% csrf_token %}
        <div class="card-body">
            <p>¿Está seguro de eliminar <strong>{{ object }}</strong>?</p>
        </div>
        <div class="card-footer">
            <button type="submit" class="btn btn-danger"><i class="fas fa-trash"></i> Eliminar</button>
            <a href="{{ list_url }}" class="btn btn-default">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
