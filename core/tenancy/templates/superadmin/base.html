{% extends 'base.html' %}
{% load static %}

{% block body %}
<body class="hold-transition layout-top-nav">
<div class="wrapper">
    <nav class="main-header navbar navbar-expand-md navbar-dark navbar-navy">
        <div class="container">
            <a href="{% url 'superadmin_dashboard' %}" class="navbar-brand">
                <i class="fas fa-layer-group"></i>
                <span class="brand-text font-weight-light">Superadmin SaaS</span>
            </a>
            <button class="navbar-toggler order-1" type="button" data-toggle="collapse" data-target="#navbarCollapse">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse order-3" id="navbarCollapse">
                <ul class="navbar-nav">
                    <li class="nav-item"><a href="{% url 'superadmin_dashboard' %}" class="nav-link">Inicio</a></li>
                    <li class="nav-item"><a href="{% url 'superadmin_company_list' %}" class="nav-link">Empresas</a></li>
                    <li class="nav-item"><a href="{% url 'superadmin_plan_list' %}" class="nav-link">Planes</a></li>
                </ul>
            </div>
            <ul class="navbar-nav ml-auto">
                <li class="nav-item"><a href="{% url 'dashboard' %}" class="nav-link"><i class="fas fa-store"></i> Ir al sistema</a></li>
                <li class="nav-item"><a href="{% url 'logout' %}" class="nav-link"><i class="fas fa-sign-out-alt"></i> Salir</a></li>
            </ul>
        </div>
    </nav>

    <div class="content-wrapper" style="min-height: calc(100vh - 57px);">
        <div class="content-header">
            <div class="container">
                <h1 class="m-0 text-dark">{{ title }}</h1>
            </div>
        </div>
        <section class="content">
            <div class="container">
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }} alert-dismissible">
                            <button type="button" class="close" data-dismiss="alert">&times;</button>
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
                {% block content %}{% endblock %}
            </div>
        </section>
    </div>
</div>
</body>
{% endblock %}
